name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Run format check
        run: bun run fmt:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run check:ci

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total_shards: [4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total_shards }})
        run: |
          files=$(find apps/mesh/src packages -name '*.test.ts' -o -name '*.test.tsx' | sort | awk "NR % ${{ matrix.total_shards }} == ${{ matrix.shard }}")
          echo "Running $(echo "$files" | wc -l) test files"
          echo "$files"
          # Bun 1.3.5 has a known WASM cleanup bug that causes SIGILL (exit 132)
          # after all tests complete. Capture output and check test results directly.
          set +e
          bun test apps/mesh/src/api/routes/decopilot/constants.test.ts apps/mesh/src/api/routes/decopilot/conversation.test.ts apps/mesh/src/api/routes/decopilot/helpers.test.ts apps/mesh/src/api/routes/decopilot/routes.test.ts apps/mesh/src/api/routes/decopilot/status.test.ts apps/mesh/src/api/watch.test.ts apps/mesh/src/auth/index.test.ts apps/mesh/src/auth/jwt.test.ts apps/mesh/src/cli/commands/auth/login.test.ts apps/mesh/src/cli/commands/auth/logout.test.ts apps/mesh/src/cli/commands/auth/whoami.test.ts apps/mesh/src/cli/lib/pkce.test.ts apps/mesh/src/cli/lib/session.test.ts apps/mesh/src/database/index.test.ts apps/mesh/src/event-bus/worker.test.ts apps/mesh/src/harnesses/claude-code/index.test.ts apps/mesh/src/harnesses/codex/index.test.ts apps/mesh/src/harnesses/decopilot/built-in-tools/registration.test.ts apps/mesh/src/harnesses/decopilot/built-in-tools/subtask.test.ts apps/mesh/src/harnesses/index.test.ts apps/mesh/src/harnesses/registry.test.ts apps/mesh/src/harnesses/types.test.ts apps/mesh/src/link-daemon/capabilities.test.ts apps/mesh/src/links/dispatcher.test.ts apps/mesh/src/links/protocol/schemas.test.ts apps/mesh/src/links/protocol/version.test.ts apps/mesh/src/mcp-apps/types.test.ts apps/mesh/src/mcp-clients/outbound/transports/monitoring.test.ts apps/mesh/src/monitoring/emit.test.ts apps/mesh/src/monitoring/schema.test.ts apps/mesh/src/nats/connection.test.ts apps/mesh/src/object-storage/fetchable.test.ts apps/mesh/src/sandbox/lifecycle.test.ts apps/mesh/src/storage/types.test.ts apps/mesh/src/tools/registry.test.ts apps/mesh/src/tools/registry/schema.test.ts apps/mesh/src/tools/sandbox/delete.test.ts apps/mesh/src/tools/sandbox/helpers.test.ts apps/mesh/src/tools/sandbox/start.test.ts apps/mesh/src/tools/thread/helpers.test.ts apps/mesh/src/web/components/chat/message/parts/tool-call-part/subtask.test.ts apps/mesh/src/web/components/chat/message/parts/tool-call-part/utils.test.ts apps/mesh/src/web/components/chat/store/hooks.test.ts apps/mesh/src/web/lib/autosend.test.ts packages/bindings/test/index.test.ts packages/bindings/test/mcp.test.ts packages/mesh-sdk/src/lib/constants.test.ts packages/mesh-sdk/src/lib/usage.test.ts packages/runtime/src/asset-server/index.test.ts packages/runtime/src/oauth.test.ts packages/runtime/src/triggers.test.ts packages/sandbox/daemon/activity.test.ts packages/sandbox/daemon/auth.test.ts packages/sandbox/daemon/config-store/classify.test.ts packages/sandbox/daemon/config-store/merge.test.ts packages/sandbox/daemon/events/broadcast.test.ts packages/sandbox/daemon/events/replay.test.ts packages/sandbox/daemon/events/sse.test.ts packages/sandbox/daemon/git/porcelain.test.ts packages/sandbox/daemon/paths.test.ts packages/sandbox/daemon/probe.test.ts packages/sandbox/daemon/proxy.test.ts packages/sandbox/daemon/routes/bash.test.ts packages/sandbox/daemon/routes/config.test.ts packages/sandbox/daemon/routes/dispatch.test.ts packages/sandbox/daemon/routes/exec.test.ts packages/sandbox/daemon/routes/fs.test.ts packages/sandbox/daemon/routes/git.test.ts packages/sandbox/daemon/routes/health.test.ts packages/sandbox/daemon/routes/idle.test.ts packages/sandbox/daemon/setup/clone.test.ts packages/sandbox/daemon/setup/orchestrator.test.ts packages/sandbox/proxy/http.test.ts packages/sandbox/proxy/loopback.test.ts packages/sandbox/proxy/websocket.test.ts packages/sandbox/server/provider/agent-sandbox/client.test.ts packages/sandbox/server/provider/desktop/runner.test.ts packages/sandbox/server/provider/index.test.ts packages/sandbox/server/provider/shared/handle.test.ts packages/std/src/backoff.test.ts packages/std/src/retry.test.ts packages/typegen/src/codegen.test.ts packages/typegen/src/runtime.test.ts packages/ui/src/lib/github.test.ts
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ $exit_code -eq 0 ]; then
            exit 0
          elif [ $exit_code -eq 132 ] && ! grep -q '[1-9][0-9]* fail' /tmp/test-output.txt; then
            echo "⚠️  Bun exited with SIGILL (known PGlite WASM cleanup bug) but all tests passed"
            exit 0
          else
            exit $exit_code
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Build server bundle
        run: bun run --cwd=apps/mesh build:server

      - name: Verify bundle outputs
        run: |
          test -f apps/mesh/dist/server/server.js
          test -f apps/mesh/dist/server/migrate.js
          test -f apps/mesh/dist/server/cli.js

      - name: Run knip
        run: bun run knip
